<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>偏心我 · pianxin.me</title>
<meta name="description" content="偏心我 pianxin.me — 世界再大，也要偏心我一个。即将上线。">
<meta name="theme-color" content="#fff6f1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23f472a0' d='M12 21s-7.5-4.9-10-9.3C.4 8.6 2.2 5 5.7 5c2 0 3.6 1.1 4.3 2.7h4c.7-1.6 2.3-2.7 4.3-2.7 3.5 0 5.3 3.6 3.7 6.7C19.5 16.1 12 21 12 21z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap&text=%20.026AEIMNPXaeimnpx%C2%A9%E3%80%82%E4%B8%80%E4%B8%8B%E4%B8%96%E4%B8%AA%E4%B9%9F%E4%BB%BD%E5%81%8F%E5%86%8D%E5%87%86%E5%9C%A8%E5%A4%87%E5%A4%A7%E5%B0%8F%E5%BE%85%E5%BF%83%E6%88%91%E6%95%AC%E6%9C%89%E6%9C%9F%E6%AD%A3%E7%82%B9%E7%88%B1%E7%95%8C%E8%A6%81%E8%AF%B7%EF%BC%8C">
<style>
  :root {
    --ink: #43282f;
    --ink-soft: rgba(67, 40, 47, .55);
    --accent: #ef6f9c;
    --accent-deep: #d94f82;
    --bg: #fff6f1;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #f9e8ee;
      --ink-soft: rgba(249, 232, 238, .5);
      --accent: #ff9ebd;
      --accent-deep: #f472a0;
      --bg: #1b1116;
    }
  }
  * { margin: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ---- drifting gradient blobs ---- */
  .blob {
    position: fixed; border-radius: 50%;
    filter: blur(90px); opacity: .55; pointer-events: none;
    will-change: transform;
  }
  .blob:nth-child(1) { width: 55vmax; height: 55vmax; left: -18vmax; top: -20vmax;
    background: #ffd3e0; animation: drift1 26s ease-in-out infinite alternate; }
  .blob:nth-child(2) { width: 45vmax; height: 45vmax; right: -15vmax; bottom: -18vmax;
    background: #ffe3c9; animation: drift2 32s ease-in-out infinite alternate; }
  .blob:nth-child(3) { width: 32vmax; height: 32vmax; right: 8vmax; top: -12vmax;
    background: #e6dcff; opacity: .4; animation: drift3 38s ease-in-out infinite alternate; }
  @media (prefers-color-scheme: dark) {
    .blob:nth-child(1) { background: #5c2438; }
    .blob:nth-child(2) { background: #4d2f22; }
    .blob:nth-child(3) { background: #352a52; }
  }
  @keyframes drift1 { to { transform: translate(9vmax, 7vmax) scale(1.12); } }
  @keyframes drift2 { to { transform: translate(-8vmax, -6vmax) scale(1.08); } }
  @keyframes drift3 { to { transform: translate(-6vmax, 9vmax); } }

  /* ---- layout ---- */
  main {
    position: relative; height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; padding: 24px; gap: 0;
  }

  .heart { width: 54px; height: 54px; margin-bottom: 34px;
    animation: beat 2.2s ease-in-out infinite; transform-origin: center; }
  @keyframes beat {
    0%, 100% { transform: scale(1); }
    12% { transform: scale(1.14); }
    24% { transform: scale(1); }
    36% { transform: scale(1.09); }
    48% { transform: scale(1); }
  }

  .domain {
    font-family: "ZCOOL KuaiLe", ui-rounded, -apple-system, sans-serif;
    font-weight: 600;
    font-size: 12px; letter-spacing: .55em; text-indent: .55em;
    text-transform: uppercase; color: var(--ink-soft); margin-bottom: 22px;
  }

  h1 {
    font-family: "ZCOOL KuaiLe", "Yuanti SC", "PingFang SC", sans-serif;
    font-weight: 400;
    font-size: clamp(56px, 13vw, 120px);
    letter-spacing: .04em;
    line-height: 1.2;
  }
  h1 .ch { display: inline-block; }
  h1 .c1 { transform: rotate(-5deg); }
  h1 .c2 { transform: rotate(4deg) translateY(-4px); }
  h1 .c3 { transform: rotate(-3deg); }
  h1 .ch:hover { animation: wiggle .5s ease-in-out; }
  @keyframes wiggle {
    0%,100% { scale: 1; } 50% { scale: 1.15; }
  }
  h1 .xin {
    background: linear-gradient(135deg, var(--accent), var(--accent-deep));
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: var(--accent);
  }

  .rule { width: 44px; height: 1px; background: var(--ink-soft);
    opacity: .5; margin: 34px 0 26px; }

  .tagline {
    font-family: "ZCOOL KuaiLe", "Yuanti SC", "PingFang SC", sans-serif;
    font-weight: 400;
    font-size: clamp(15px, 2.6vw, 18px);
    letter-spacing: .18em; text-indent: .18em;
    color: var(--ink); opacity: .85;
  }
  .soon {
    font-family: "ZCOOL KuaiLe", "Yuanti SC", "PingFang SC", sans-serif;
    margin-top: 16px; font-size: 12px; letter-spacing: .3em; text-indent: .3em;
    color: var(--ink-soft);
  }
  .soon i { font-style: normal; animation: dots 1.8s infinite; display: inline-block; }
  .soon i:nth-child(2) { animation-delay: .3s; }
  .soon i:nth-child(3) { animation-delay: .6s; }
  @keyframes dots { 0%, 60%, 100% { opacity: .25; } 30% { opacity: 1; } }

  footer {
    position: fixed; bottom: 22px; left: 0; right: 0;
    text-align: center; font-size: 11px; letter-spacing: .2em;
    color: var(--ink-soft); pointer-events: none;
  }

  .hint {
    font-family: "ZCOOL KuaiLe", "Yuanti SC", "PingFang SC", sans-serif;
    position: fixed; bottom: 48px; left: 0; right: 0;
    text-align: center; font-size: 11px; letter-spacing: .25em;
    color: var(--ink-soft); opacity: .7; pointer-events: none;
    transition: opacity 1s;
  }

  /* ---- click hearts ---- */
  .fly {
    position: fixed; pointer-events: none; z-index: 10;
    font-size: 0; width: 22px; height: 22px;
    animation: fly 1.6s ease-out forwards;
  }
  .fly svg { width: 100%; height: 100%; }
  @keyframes fly {
    0% { transform: translate(-50%, -50%) scale(.4) rotate(0deg); opacity: 0; }
    15% { opacity: 1; }
    100% { transform: translate(-50%, -240%) scale(1.15) rotate(var(--rot, 12deg)); opacity: 0; }
  }

  /* entrance */
  .rise { animation: rise 1.1s cubic-bezier(.2, .7, .2, 1) both; }
  .rise.d1 { animation-delay: .12s; } .rise.d2 { animation-delay: .24s; }
  .rise.d3 { animation-delay: .4s; } .rise.d4 { animation-delay: .55s; }
  @keyframes rise { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: none; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; }
  }
</style>
</head>
<body>
  <div class="blob"></div><div class="blob"></div><div class="blob"></div>

  <main>
    <svg class="heart rise" viewBox="0 0 24 24" aria-hidden="true">
      <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#f98bb0"/><stop offset="1" stop-color="#d94f82"/>
      </linearGradient></defs>
      <path fill="url(#g)" d="M12 21s-7.5-4.9-10-9.3C.4 8.6 2.2 5 5.7 5c2 0 3.6 1.1 4.3 2.7h4c.7-1.6 2.3-2.7 4.3-2.7 3.5 0 5.3 3.6 3.7 6.7C19.5 16.1 12 21 12 21z"/>
    </svg>

    <div class="domain rise d1">pianxin.me</div>
    <h1 class="rise d2"><span class="ch c1">偏</span><span class="ch c2 xin">心</span><span class="ch c3">我</span></h1>
    <div class="rule rise d3"></div>
    <p class="tagline rise d3">世界再大，也要偏心我一个。</p>
    <p class="soon rise d4">正在准备一份偏爱，敬请期待<i>.</i><i>.</i><i>.</i></p>
  </main>

  <div class="hint" id="hint">点一下，有小心心</div>
  <footer>© 2026 PIANXIN.ME</footer>

<script>
  const heartSVG = '<svg viewBox="0 0 24 24"><path fill="COLOR" d="M12 21s-7.5-4.9-10-9.3C.4 8.6 2.2 5 5.7 5c2 0 3.6 1.1 4.3 2.7h4c.7-1.6 2.3-2.7 4.3-2.7 3.5 0 5.3 3.6 3.7 6.7C19.5 16.1 12 21 12 21z"/></svg>';
  const colors = ['#f472a0', '#f98bb0', '#d94f82', '#ffb3c7', '#e59ab5'];
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let hinted = false;

  addEventListener('pointerdown', e => {
    if (reduced) return;
    for (let i = 0; i < 5; i++) {
      const el = document.createElement('div');
      el.className = 'fly';
      el.innerHTML = heartSVG.replace('COLOR', colors[Math.random() * colors.length | 0]);
      el.style.left = (e.clientX + (Math.random() - .5) * 70) + 'px';
      el.style.top = (e.clientY + (Math.random() - .5) * 30) + 'px';
      el.style.setProperty('--rot', (Math.random() * 50 - 25) + 'deg');
      el.style.animationDelay = (i * 60) + 'ms';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 2200);
    }
    if (!hinted) { hinted = true; document.getElementById('hint').style.opacity = 0; }
  }, { passive: true });

  // gentle parallax on blobs
  if (!reduced) {
    const blobs = document.querySelectorAll('.blob');
    addEventListener('pointermove', e => {
      const x = (e.clientX / innerWidth - .5), y = (e.clientY / innerHeight - .5);
      blobs.forEach((b, i) => {
        const f = (i + 1) * 12;
        b.style.translate = `${x * f}px ${y * f}px`;
      });
    }, { passive: true });
  }
</script>
</body>
</html>
