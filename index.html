<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>偏心我 · pinxin.me</title>
<meta name="description" content="偏心我 — 即将上线">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💗</text></svg>">
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100vh; display: grid; place-items: center;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", "Helvetica Neue", sans-serif;
    background: radial-gradient(circle at 30% 20%, #ffe3ec, #fff6f0 60%);
    color: #3a2a30; text-align: center; padding: 24px;
  }
  @media (prefers-color-scheme: dark) {
    body { background: radial-gradient(circle at 30% 20%, #3b1d2a, #161014 60%); color: #f6e7ec; }
  }
  .heart { font-size: 64px; animation: beat 1.6s ease-in-out infinite; display: inline-block; }
  @keyframes beat { 0%,100% { transform: scale(1); } 15% { transform: scale(1.15); } 30% { transform: scale(1); } 45% { transform: scale(1.1); } }
  h1 { font-size: clamp(40px, 9vw, 72px); letter-spacing: .12em; margin: 16px 0 8px; font-weight: 700; }
  .domain { opacity: .6; letter-spacing: .2em; font-size: 14px; }
  p { margin-top: 28px; opacity: .75; font-size: 16px; }
</style>
</head>
<body>
  <main>
    <div class="heart">💗</div>
    <h1>偏心我</h1>
    <div class="domain">PINXIN.ME</div>
    <p>正在偷偷准备中，敬请期待。</p>
  </main>
</body>
