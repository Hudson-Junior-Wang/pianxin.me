<style>

  @media (prefers-color-scheme: dark) { :root { --ink: #f3e9e4; --muted: #b5a39a; --bg: #1c1715; --card: #2a2320; --line: #463a33; --accent: #f59d74; --soft: #342b27; color-scheme: dark; } }
  * { box-sizing: border-box; }
  body { margin: 0; color: var(--ink); background: var(--bg); font: 15px/1.7 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; -webkit-font-smoothing: antialiased; }
  main { min-height: 100svh; max-width: 960px; margin: auto; padding: 36px 24px 28px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }

  .sub { color: var(--muted); margin: 0; font-size: 13px; }
  .doors { display: flex; gap: 16px; margin: 30px 0 26px; }
  .door { min-width: 190px; padding: 14px 20px 14px 12px; display: flex; align-items: center; gap: 12px; color: var(--ink); text-decoration: none; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 20px; box-shadow: 0 6px 20px #845b3410; transition: transform .2s, border-color .2s; }
  .door:hover { transform: translateY(-3px); border-color: var(--accent); }
  .door:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
  .door img { width: 52px; height: 52px; object-fit: contain; }
  .door span { display: flex; flex-direction: column; }
  .door b { font-size: 16px; }
  .door small { color: var(--muted); font-size: 11px; }
  .door em { margin-left: auto; font-size: 20px; color: var(--accent); font-style: normal; }
  .features { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
  .features span { background: var(--soft); color: var(--muted); padding: 4px 12px; border-radius: 30px; font-size: 12px; }
  footer { color: var(--muted); font-size: 11px; margin-top: 32px; }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } }
  @media (max-width: 480px) { main { padding: 24px 20px; } .doors { width: 100%; flex-direction: column; gap: 10px; margin: 24px 0; } .door { min-width: 0; } .scene { width: 160px; } }
